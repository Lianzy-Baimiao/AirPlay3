[package]
name = "airplay3"
version = "3.4.0"
edition = "2024"
rust-version = "1.85"
description = "AirPlay3 本地音乐播放器 (Rust 重写版)"
build = "build.rs"

[[bin]]
name = "AirPlay3"
path = "src/main.rs"

[dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["opt-simd", "all-meta", "aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis", "caf", "isomp4", "mkv", "ogg", "aiff", "wav"] }
lofty = "=0.25.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
encoding_rs = "=0.8.42"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
parking_lot = "=0.12.5"
crossbeam-channel = "=0.5.17"
quick-xml = "=0.42.0"
pinyin = { version = "=0.11.0", default-features = false, features = ["plain", "heteronym"] }
rfd = { version = "=0.17.2", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls", "gzip", "json", "socks-proxy", "win-system-proxy"] }
log = "=0.4.34"
anyhow = "=1.0.104"
raw-window-handle = "=0.6.2"
fastrand = "=2.5.0"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Media_MediaFoundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Foundation",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
